<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cometGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c0f0"/>
      <stop offset="50%" stop-color="#0099e6"/>
      <stop offset="100%" stop-color="#0077cc"/>
    </linearGradient>
  </defs>
  <!-- Comet Meteor Icon (angled down-left like the official mark) -->
  <g transform="translate(15, 10)">
    <!-- Outer tail flame shapes -->
    <path d="M 105 18 C 132 45 132 88 105 115 C 80 140 40 142 18 122 L 2 136 C -1 139 -6 136 -4 132 L 8 112 C -2 100 -2 88 4 76 L 16 90 C 22 75 32 60 48 44 C 64 28 85 18 105 18 Z" fill="url(#cometGrad)"/>
    <!-- Outer white concentric arc -->
    <circle cx="95" cy="48" r="34" fill="#ffffff" />
    <!-- Secondary colored ring -->
    <circle cx="95" cy="48" r="26" fill="url(#cometGrad)" />
    <!-- Inner white nucleus -->
    <circle cx="95" cy="48" r="16" fill="#ffffff" />
    <!-- Center core droplet -->
    <circle cx="95" cy="48" r="9" fill="url(#cometGrad)" />
  </g>
  <!-- Wordmark "CometAPI" -->
  <text x="175" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="-1.5px" fill="#ffffff">
    Comet<tspan fill="#00b4d8">API</tspan>
  </text>
</svg>
